<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendsgiving Feud</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:"Arial Black","Arial Bold",Gadget,"Helvetica Neue",Arial,sans-serif}
body.board-mode{overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#01061a;overflow:hidden}
#stage{flex:none;width:1600px;height:900px;position:relative;overflow:hidden;transform-origin:center center;
  background:radial-gradient(ellipse at 50% 42%,#2468e0 0%,#0c3492 38%,#051a52 72%,#020a26 100%)}
#rays{position:absolute;left:50%;top:45%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.055) 0deg 5deg,transparent 5deg 15deg);animation:spin 90s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#screen{position:absolute;inset:0}
.abs{position:absolute}

/* ---------- gold frames ---------- */
.gold{background:linear-gradient(180deg,#fff3b0 0%,#f2c64a 22%,#c98d12 55%,#ffe27a 80%,#a86d06 100%);
  box-shadow:0 0 0 4px #5a3800,0 18px 50px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.7)}
.team{top:26px;width:310px;height:156px;border-radius:22px;padding:9px}
.team .nm{height:42px;display:flex;align-items:center;justify-content:center;color:#3b2300;font-size:25px;text-transform:uppercase;
  letter-spacing:1px;white-space:nowrap;overflow:hidden;padding:0 8px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.team .sc,.bank .sc{background:linear-gradient(#0a2466,#04133d);border-radius:14px;height:88px;display:flex;align-items:center;justify-content:center;
  font-size:74px;text-shadow:0 4px 0 #000,0 0 22px rgba(120,180,255,.6);box-shadow:inset 0 0 18px rgba(0,0,0,.8)}
.team.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{transform:scale(1.09);filter:brightness(1.35)}}
.bank{left:665px;top:26px;width:270px;height:156px;border-radius:22px;padding:9px}
.bank .nm{height:42px;display:flex;align-items:center;justify-content:center;color:#3b2300;font-size:22px;letter-spacing:3px}
.mult{position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;background:#d1260e;border:3px solid #ffd54a;border-radius:20px;
  padding:3px 16px;font-size:17px;letter-spacing:2px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.qbar{left:150px;top:200px;width:1300px;height:58px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:28px;line-height:1.1;text-shadow:0 3px 0 #000;padding:0 20px;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:900}
.qbar.hide{visibility:hidden}

/* ---------- main board ---------- */
.board{left:150px;top:268px;width:1300px;height:582px;border-radius:30px;padding:20px}
.bin{width:100%;height:100%;background:#03113a;border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(4,1fr);grid-auto-flow:column;gap:13px 16px;box-shadow:inset 0 0 30px #000}
.slot{perspective:1400px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.4,.5,1)}
.slot.open .card{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;display:flex;align-items:center;
  border:3px solid #8fb8ff;overflow:hidden}
.front{justify-content:center;background:linear-gradient(180deg,#3d7ef5 0%,#1a4fc2 45%,#0b2c7c 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.slot.empty .front{background:linear-gradient(#0c275f,#061840);border-color:#21407e;box-shadow:none}
.num{width:132px;height:84px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#2a62d8,#0a2a78 70%);border:4px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:52px;text-shadow:0 3px 0 #000;box-shadow:0 0 14px rgba(0,0,0,.6)}
.back{transform:rotateX(180deg);justify-content:space-between;background:linear-gradient(180deg,#5aa0ff 0%,#2363da 40%,#0f3d9e 100%)}
.ans{flex:1;padding-left:24px;text-transform:uppercase;text-shadow:0 3px 0 #04194d,0 0 10px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;letter-spacing:.5px}
.pts{width:118px;height:100%;flex:none;display:flex;align-items:center;justify-content:center;font-size:54px;
  background:linear-gradient(180deg,#2c66d8,#0a2d80);border-left:3px solid #8fb8ff;text-shadow:0 3px 0 #000}
.foot{left:150px;top:860px;width:1300px;height:34px;display:flex;align-items:center;justify-content:space-between;font-size:18px;letter-spacing:2px;color:#cfe0ff}
.ministrikes{display:flex;gap:8px}
.ministrikes span{width:30px;height:30px;border:2px solid #6a86c9;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#2a3e70;font-size:22px}
.ministrikes span.on{color:#ff2a2a;border-color:#fff;background:rgba(0,0,0,.4)}

/* ---------- overlays ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:40}
.xs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:50px;animation:xpop 1.5s ease forwards}
.xs svg{width:270px;height:330px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8))}
@keyframes xpop{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.12);opacity:1}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#0b3aa8,#020a26 75%);
  animation:splash 2.6s ease forwards;z-index:45}
.splash .big{font-size:150px;line-height:1;background:linear-gradient(#fff7c2,#ffcc33 45%,#c97f00);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px #5a3200;filter:drop-shadow(0 8px 0 #000)}
.splash .sub{margin-top:24px;font-size:58px;letter-spacing:6px;color:#fff;text-shadow:0 5px 0 #b3200b,0 0 30px #ff5a1a}
@keyframes splash{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;visibility:hidden}}
.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:90px;color:#fff;background:#c4160b;border:8px solid #fff;
  padding:20px 50px;border-radius:24px;animation:xpop 1.6s ease forwards;white-space:nowrap;box-shadow:0 20px 60px #000}
.confetti{position:absolute;top:-30px;width:16px;height:26px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(980px) rotate(900deg)}}

/* ---------- logo / title ---------- */
.logo{position:relative;width:1000px;height:540px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#ffb547 0%,#f06a12 35%,#b02e04 72%,#5e1400 100%);
  border:18px solid #ffd54a;box-shadow:0 0 0 8px #6b3a00,0 0 0 14px #ffe991,0 0 90px rgba(255,170,40,.65),inset 0 0 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo .l1{font-size:78px;letter-spacing:4px;color:#fff;text-shadow:0 5px 0 #6b1800,0 0 20px rgba(0,0,0,.4)}
.logo .l2{font-size:250px;line-height:.9;background:linear-gradient(#fffbe0,#ffd23a 40%,#e08a00 75%,#fff0a0);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-stroke:5px #5a2400;filter:drop-shadow(0 10px 0 #3a1400)}
.logo .leaf{position:absolute;font-size:80px;white-space:nowrap}
.titlewrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.titlewrap .logo{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) scale(1.015)}}
.blink{font-size:30px;letter-spacing:4px;animation:blink 1.4s steps(2) infinite;text-shadow:0 3px 0 #000}
@keyframes blink{50%{opacity:.25}}
.vs{font-size:44px;text-shadow:0 4px 0 #000;letter-spacing:2px}
.vs b{color:#ffd54a}

/* ---------- winner ---------- */
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.win .t{font-size:120px;line-height:1;background:linear-gradient(#fff7c2,#ffcc33 45%,#c97f00);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px #5a3200;filter:drop-shadow(0 8px 0 #000);text-transform:uppercase;max-width:1500px}
.win .s{font-size:46px;text-shadow:0 4px 0 #000}
.win .sc{display:flex;gap:60px}
.win .sc .gold{position:relative}

/* ---------- fast money ---------- */
.fmtitle{left:0;top:30px;width:1600px;text-align:center;font-size:92px;line-height:1;background:linear-gradient(#fff7c2,#ffcc33 45%,#c97f00);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #5a3200;filter:drop-shadow(0 6px 0 #000)}
.timer{right:80px;top:22px;width:170px;height:170px;border-radius:50%;padding:10px}
.timer .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(#0f3aa0,#04133d);display:flex;align-items:center;justify-content:center;
  font-size:78px;text-shadow:0 4px 0 #000;box-shadow:inset 0 0 20px #000}
.timer.low .in{color:#ff4a3a;animation:pulse .5s infinite}
.fmwho{left:80px;top:60px;font-size:30px;letter-spacing:2px;color:#ffd54a;text-shadow:0 3px 0 #000}
.fmboard{left:110px;top:200px;width:1380px;height:560px;border-radius:30px;padding:20px}
.fmin{width:100%;height:100%;background:#03113a;border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);
  grid-auto-flow:column;gap:12px 30px;box-shadow:inset 0 0 30px #000}
.fmc{display:flex;border:3px solid #8fb8ff;border-radius:8px;overflow:hidden;background:linear-gradient(#245ad0,#0c2f86)}
.fmc.sel{box-shadow:0 0 0 3px #ffd54a}
.fmt{flex:1;display:flex;align-items:center;padding-left:20px;font-size:34px;text-transform:uppercase;text-shadow:0 3px 0 #04194d;white-space:nowrap;overflow:hidden}
.fmt input{width:96%;font:inherit;font-size:32px;text-transform:uppercase;background:#fff;color:#0a2466;border:0;border-radius:6px;padding:4px 10px;outline:none}
.fmp{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(#2c66d8,#0a2d80);border-left:3px solid #8fb8ff;text-shadow:0 3px 0 #000}
.fmc.hid{background:linear-gradient(#0c275f,#061840);border-color:#21407e}
.fmc.hid .fmt,.fmc.hid .fmp{visibility:hidden}
.fmc.zero .fmp{color:#ff8a7a}
.fmc.pop .fmp{animation:pulse .6s ease 1}
.fmtotal{left:520px;top:775px;width:560px;height:100px;border-radius:20px;padding:9px;display:flex}
.fmtotal .l{width:210px;display:flex;align-items:center;justify-content:center;color:#3b2300;font-size:40px;letter-spacing:3px}
.fmtotal .v{flex:1;background:linear-gradient(#0a2466,#04133d);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:66px;text-shadow:0 4px 0 #000}
.fmtotal.won .v{color:#ffd54a;animation:pulse .8s infinite}
.fmgoal{left:1110px;top:800px;font-size:24px;color:#cfe0ff;letter-spacing:2px}

/* ---------- setup ---------- */
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.panel{width:1180px;background:rgba(3,17,58,.92);border:4px solid #ffd54a;border-radius:26px;padding:24px 50px;box-shadow:0 30px 90px #000;font-family:"Helvetica Neue",Arial,sans-serif}
.panel h1{font-family:"Arial Black",Arial,sans-serif;font-size:58px;text-align:center;color:#ffd54a;text-shadow:0 4px 0 #000;margin-bottom:6px}
.panel .tag{text-align:center;color:#cfe0ff;font-size:20px;margin-bottom:16px}
.row{display:flex;gap:30px;margin-bottom:14px}
.row label{flex:1;font-size:20px;font-weight:700;color:#ffd54a;display:block}
.row input[type=text]{display:block;width:100%;margin-top:8px;font-size:30px;padding:12px 16px;border-radius:12px;border:3px solid #8fb8ff;background:#0a2466;color:#fff;font-weight:800}
.pick{display:flex;gap:16px;margin-top:8px}
.pick button{flex:1}
.btns{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.btn{font:800 22px "Helvetica Neue",Arial,sans-serif;padding:16px 26px;border-radius:14px;border:3px solid #8fb8ff;background:#0a2466;color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.25)}
.btn.primary{background:linear-gradient(#ffe27a,#d39a18);color:#3b2300;border-color:#fff3b0;font-size:28px;flex:1.4}
.btn.on{background:#d1260e;border-color:#ffd54a}
.hint{margin-top:12px;font-size:16px;line-height:1.5;color:#cfe0ff}
.hint b{color:#fff}

/* ---------- help ---------- */
#help{position:absolute;inset:60px 120px;z-index:60;background:rgba(2,10,38,.97);border:4px solid #ffd54a;border-radius:24px;padding:34px 46px;
  font-family:"Helvetica Neue",Arial,sans-serif;display:none;columns:2;column-gap:50px;font-size:21px;line-height:1.55}
#help.show{display:block}
#help h2{column-span:all;font-family:"Arial Black",Arial;color:#ffd54a;font-size:34px;margin-bottom:10px}
#help h3{color:#ffd54a;font-size:22px;margin-top:10px;break-after:avoid}
#help kbd{display:inline-block;min-width:34px;text-align:center;background:#0a2466;border:2px solid #8fb8ff;border-radius:6px;padding:0 7px;font-weight:800;margin-right:6px}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.8);border:2px solid #ffd54a;border-radius:14px;padding:10px 24px;
  font-size:22px;z-index:70;animation:xpop 2s ease forwards;font-family:"Helvetica Neue",Arial}

/* ---------- sound panel ---------- */
#sndPanel{position:absolute;inset:24px 150px;z-index:65;background:rgba(2,10,38,.98);border:4px solid #ffd54a;border-radius:24px;padding:24px 36px;font-family:"Helvetica Neue",Arial,sans-serif;overflow:auto}
#sndPanel h2{font-family:"Arial Black",Arial;color:#ffd54a;font-size:34px}
.sp-note{font-size:17px;color:#cfe0ff;margin:4px 0 8px;line-height:1.45}
.sp-row{display:flex;align-items:center;gap:12px;padding:5px 0;border-top:1px solid #21407e}
.sp-l{flex:1;display:flex;flex-direction:column;font-size:19px}.sp-l span{font-size:15px;color:#9fb8e8}.sp-l i{font-size:14px;color:#7dff9a;font-style:normal}
.sp-row .btn{font-size:17px;padding:9px 14px}
.qinfo{margin-top:8px;font-size:19px;font-weight:400;color:#e6eeff;line-height:1.45;background:#0a2466;border:2px solid #2d4f9e;border-radius:12px;padding:10px 14px}
.qinfo b{color:#ffd54a}
/* ---------- control glow + room code ---------- */
.team.ctl{box-shadow:0 0 0 4px #5a3800,0 0 45px 14px rgba(255,213,74,.85)}
.team .tag{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);background:#2fa84a;border:3px solid #fff;border-radius:16px;padding:2px 14px;font-size:16px;letter-spacing:2px;white-space:nowrap}
.room{margin-top:12px;padding:14px 18px;border-radius:14px;background:#0a2466;border:2px dashed #ffd54a;font-size:20px;line-height:1.5;color:#cfe0ff}
.room b.code{font-family:"Arial Black",Arial;font-size:38px;letter-spacing:8px;color:#ffd54a;vertical-align:middle;margin:0 6px}
.room .url{color:#fff;font-weight:800;word-break:break-all}
/* ---------- host remote ---------- */
body.host-mode{background:#06123a;font-family:"Helvetica Neue",Arial,sans-serif;overflow:auto}
#host{max-width:900px;margin:0 auto;padding:14px 14px 60px}
#host h1{font-family:"Arial Black",Arial;color:#ffd54a;font-size:26px;margin:4px 0 10px}
.hcard{background:#0b1f5c;border:2px solid #2d4f9e;border-radius:14px;padding:12px;margin-bottom:12px}
.hcard h2{font-size:15px;letter-spacing:1px;color:#9fc3ff;margin-bottom:8px;text-transform:uppercase}
.hq{font-size:21px;font-weight:800;margin-bottom:10px}
.hans{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#123177;margin-bottom:6px;cursor:pointer;font-size:19px;font-weight:700;border:2px solid transparent}
.hans.done{opacity:.45;cursor:default}
.hans .n{width:30px;height:30px;border-radius:50%;background:#fff;color:#0a2466;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.hans .p{margin-left:auto;font-weight:900;color:#ffd54a}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.hb{font:800 17px "Helvetica Neue",Arial;padding:13px 8px;border-radius:10px;border:2px solid #8fb8ff;background:#123177;color:#fff;cursor:pointer}
.hb.red{background:#a8180b;border-color:#ff8a7a}
.hb.gold{background:linear-gradient(#ffe27a,#d39a18);color:#3b2300;border-color:#fff3b0;box-shadow:none}
.hscore{display:flex;gap:10px;flex-wrap:wrap}
.hscore>div{flex:1 1 150px;min-width:0;background:#123177;border-radius:10px;padding:8px;text-align:center}
.hscore .v{font-size:34px;font-weight:900}
.hscore .tn{font-weight:800;color:#ffd54a}
.hscore .adj{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.hscore .adj button{padding:6px 9px;font-size:14px}
.hfm{display:grid;grid-template-columns:1fr;gap:6px}
.hfmrow{background:#123177;border-radius:10px;padding:8px}
.hfmrow .q{font-weight:800;font-size:16px;margin-bottom:4px}
.hfmrow .opts{font-size:13px;color:#b9cdf7;margin-bottom:6px}
.hfmrow .line{display:flex;gap:6px;align-items:center;margin-top:4px}
.hfmrow.cur{outline:3px solid #ffd54a;border-radius:10px}
.hfmrow .fmv{min-width:44px;text-align:center;font:900 22px Arial;color:#ffd54a}
.hfmrow input:disabled{background:#dfe8ff;color:#0a2466}
.hfmrow input{flex:1;font-size:17px;padding:8px;border-radius:8px;border:2px solid #8fb8ff;background:#fff;color:#0a2466;font-weight:700;min-width:0}
.hfmrow .m{font-size:13px;color:#ffd54a;min-width:110px}
.hfmrow button{padding:8px 10px;font-size:14px}
.hsay{font-size:20px;line-height:1.4;background:#fff6d6;color:#3b2300;border-radius:10px;padding:12px 14px;font-weight:800;margin-bottom:8px}
.hdo{font-size:16px;color:#d6e4ff;line-height:1.5}
.hscript h2{color:#ffd54a}
.hcue{font-size:15px;color:#9fc3ff;font-style:italic;margin:-2px 0 8px 4px}
.hlink{font-size:14px;font-weight:800;padding:6px 10px;border-radius:8px;background:#5a1a10;margin-bottom:10px;display:inline-block}
.hlink.ok{background:#14532d}
.hrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.hrow input{flex:1;min-width:0;font-size:18px;padding:8px;border-radius:8px;border:2px solid #8fb8ff;background:#fff;color:#0a2466;font-weight:800}
.hb.sel{background:#2fa84a;border-color:#fff}
#roomIn{font-size:30px;letter-spacing:8px;text-transform:uppercase;text-align:center}
.wait{padding:30px;text-align:center;font-size:20px;line-height:1.6}

/* ---------- guided flow ---------- */
.phase{left:372px;top:34px;width:272px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;background:rgba(4,19,61,.85);border:3px solid #ffd54a}
.phase .rn{font-size:22px;letter-spacing:2px;color:#cfe0ff}
.phase .pn{font-size:33px;line-height:1.05;color:#ffd54a;text-shadow:0 3px 0 #000;margin-top:6px}
.phase.red{border-color:#ff5a4a}.phase.red .pn{color:#ff6a5a}
.akc{left:1035px;top:36px;width:136px;height:136px;border-radius:50%;padding:8px}
.akc .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(#0f3aa0,#04133d);display:flex;align-items:center;justify-content:center;font-size:66px;color:#fff}
.akc.low .in{color:#ff4a3a;animation:pulse .5s infinite}
.akc.off{display:none}
.team.stl{box-shadow:0 0 0 4px #5a0800,0 0 45px 14px rgba(255,70,50,.85)}
.team .tag.red{background:#c4160b}
.team .tag.blue{background:#1d4fd8}
.hsteps{display:flex;gap:4px;margin-bottom:10px}
.hsteps span{flex:1;font-size:12px;font-weight:800;padding:7px 2px;border-radius:8px;background:#123177;text-align:center;color:#9fc3ff}
.hsteps span.on{background:#ffd54a;color:#3b2300}
.hsteps span.past{background:#1d6b33;color:#fff}
.hnow{border-color:#ffd54a}
.hnow h2{color:#ffd54a;font-size:17px}
.hb.hbig{font-size:21px;padding:18px 8px}
.hans.dim{opacity:.6;cursor:default}
.hnote{font-size:16px;color:#ffe9a8;background:#3b2a00;border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:700}

#print{display:none}
@media print{
  body{background:#fff!important;color:#000;overflow:visible!important}

}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function usedSet(){try{return new Set(JSON.parse(localStorage.getItem('ffeud_used')||'[]'))}catch(e){return new Set()}}
function markUsed(ids){try{const u=[...usedSet()].filter(x=>!ids.includes(x)).concat(ids);localStorage.setItem('ffeud_used',JSON.stringify(u.slice(-300)))}catch(e){}}
/* fresh (not recently played) questions first, then the least-recent ones */
function pickQ(list,n,ex){const used=[...usedSet()];const avail=list.filter(q=>!ex.has(q.id));
  const fresh=shuffle(avail.filter(q=>!used.includes(q.id))),old=avail.filter(q=>used.includes(q.id)).sort((x,y)=>used.indexOf(x.id)-used.indexOf(y.id));
  const out=fresh.concat(old).slice(0,n);out.forEach(q=>ex.add(q.id));return out}
function setIds(st){return [...st.set.rounds,st.set.sd,...st.set.fm]}
function drawSet(){const ex=new Set(),M=c=>POOL.main.filter(q=>q.c===c);
  const tg=pickQ(M('tg'),2,ex),xm=pickQ(M('xm'),1,ex),wild=pickQ(Math.random()<.5?M('xm'):M('hol'),1,ex);
  const rounds=shuffle([...tg,...xm,...wild]).map(q=>q.id);
  const set={rounds,m:[1,1,2,3],sd:pickQ(POOL.sd,1,ex)[0].id,fm:pickQ(POOL.fm,5,ex).map(q=>q.id)};
  markUsed([...set.rounds,set.sd,...set.fm]);return set}

  cells:[0,1].map(()=>[0,1,2,3,4].map(()=>({text:'',m:-1,shown:false})))}}
function freshGame(names){return {screen:'title',teams:[{name:names[0],score:0},{name:names[1],score:0}],set:drawSet(),r:0,rev:[],strikes:0,bank:0,awarded:false,showQ:true,fm:freshFM(),ph:'faceoff',fo:{buzz:null,turn:null,first:null},foWin:null,ak:null,akOut:false,akOn:false,akSec:30,gameWinner:null}}
function roundsOf(st){return [...st.set.rounds.map((id,i)=>({...QBYID[id],m:st.set.m[i]})),{...QBYID[st.set.sd],a:QBYID[st.set.sd].a.slice(0,1),m:3,sudden:true}]}
function cur(){return roundsOf(S)[S.r]}
function fmQ(r,st=S){return QBYID[st.set.fm[r]]}
function cellPts(p,r,st=S){const c=st.fm.cells[p][r];if(!c.shown)return null;return c.m>=0?fmQ(r,st).a[c.m].p:0}
function fmTotal(st=S){let t=0;for(let p=0;p<2;p++)for(let r=0;r<5;r++){const v=cellPts(p,r,st);if(v)t+=v}return t}

/* ---------- fuzzy answer matching for Fast Money ---------- */
function norm(s){return String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9 ]/g,'').replace(/\b(the|a|an|my|your|his|her)\b/g,' ').replace(/\s+/g,'').replace(/(es|s)$/,'')}
function matchAnswer(text,q){
  const t=norm(text); if(!t) return -1; let best=-1,bl=0;
  for(let i=0;i<q.a.length;i++){
    for(const key of [q.a[i].t,...q.a[i].al]){
      const k=norm(key); if(!k) continue;
      if(t===k) return i;
      let L=0; if(k.length>=3&&t.includes(k))L=k.length; else if(t.length>=4&&k.includes(t)&&t.length>=0.6*k.length)L=t.length;
      if(L>bl){bl=L;best=i}
    }
  }
  return best;
}

let AC=null,MASTER=null,muted=false;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(c).connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();return AC}
function tone(type,f,t0,dur,vol,opt={}){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(opt.to)o.frequency.exponentialRampToValueAtTime(opt.to,t0+dur);
  let node=o; if(opt.lp){const f2=a.createBiquadFilter();f2.type='lowpass';f2.frequency.value=opt.lp;o.connect(f2);node=f2}
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+(opt.att||.008));
  if(opt.sus){g.gain.setValueAtTime(vol,t0+dur-.06);g.gain.exponentialRampToValueAtTime(.0001,t0+dur)}else g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  node.connect(g).connect(MASTER);o.start(t0);o.stop(t0+dur+.05)}
function noiseBuf(sec,fill){const a=ac(),n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);fill(d,a.sampleRate);return b}
const SND={
  ding(){const t=ac().currentTime,bell=(f,d,v)=>[[1,1],[2,.5],[2.76,.3],[4.07,.16],[5.4,.08]].forEach(([r,a])=>tone('sine',f*r,t+d,2.2/(.5+r*.5),v*a,{att:.003}));
    bell(1318.5,0,.42);bell(1975.5,.1,.34);tone('triangle',2637,t,.12,.12,{att:.002})},
  buzz(){const t=ac().currentTime;tone('sawtooth',138,t,.95,.38,{sus:1,lp:1400});tone('square',145,t,.95,.22,{sus:1,lp:1100});tone('sawtooth',69,t,.95,.25,{sus:1,lp:600})},
  dup(){const t=ac().currentTime;[0,.32].forEach(d=>{tone('sawtooth',138,t+d,.24,.35,{sus:1,lp:1400});tone('square',145,t+d,.24,.2,{sus:1,lp:1100})})},
  tick(){const t=ac().currentTime;tone('square',1100,t,.06,.15)},
  theme(){const t=ac().currentTime,N=[[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.42,.32],[784,.78,.14],[1047,.92,.7]];
    N.forEach(([f,d,l])=>{tone('sawtooth',f,t+d,l,.16,{lp:2600,sus:1});tone('square',f/2,t+d,l,.07,{lp:1200,sus:1});tone('triangle',f*2,t+d,l,.05,{sus:1})});
    tone('sine',130,t,1.6,.2)},
  whoosh(){const a=ac(),t=a.currentTime,s=a.createBufferSource();s.buffer=noiseBuf(.6,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1});
    const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(5000,t+.5);
    const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+.6);s.connect(f).connect(g).connect(MASTER);s.start(t)},
  applause(sec=3.5){const a=ac(),t=a.currentTime,s=a.createBufferSource();
    s.buffer=noiseBuf(sec,(d,sr)=>{const claps=Math.floor(sec*260);for(let c=0;c<claps;c++){const st=Math.floor(Math.random()*(d.length-sr*.02)),len=Math.floor(sr*(.006+Math.random()*.012)),amp=.3+Math.random()*.7;
      for(let i=0;i<len;i++)d[st+i]+=(Math.random()*2-1)*amp*Math.exp(-i/(len/3))}
      for(let i=0;i<d.length;i++){const x=i/d.length;d[i]*=Math.min(1,x*8)*Math.min(1,(1-x)*2.5)*.5}});
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.6;const g=a.createGain();g.gain.value=.9;s.connect(f).connect(g).connect(MASTER);s.start(t)},
  buzzin(){const t=ac().currentTime;tone('square',1320,t,.45,.2,{sus:1,lp:4200});tone('sine',660,t,.45,.22,{sus:1})},
  board(n=6){const t=ac().currentTime;for(let k=0;k<n;k++)tone('square',520+k*45,t+k*.12,.09,.13,{lp:2400})},
  win(){SND.theme();setTimeout(()=>SND.applause(4.5),300)},
};
function play(n,...a){if(muted||IS_HOST)return;try{SND[n](...a)}catch(e){console.warn(e)}}

const SLOTS=[['theme','🎵 Theme song','Title screen, Fast Money intro, winner screen'],['round','🎬 Round start','Each “ROUND X” splash (if empty: first seconds of the theme)'],
  ['board','🟦 Board reveal','When the answer boxes appear after the splash'],['buzzin','🔔 Face-off buzzer','When you tap who hit the buzzer first'],

const CUSTOM={},CNAME={},SBLOB={},CBUF={};let music=null,musicKey=null,FILEOUT=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ffeud',1);r.onupgradeneeded=()=>r.result.createObjectStore('snd');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function sndPut(k,file){const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('snd','readwrite');file?t.objectStore('snd').put(file,k):t.objectStore('snd').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)});
  if(CUSTOM[k])URL.revokeObjectURL(CUSTOM[k]);delete CUSTOM[k];delete CNAME[k];delete SBLOB[k];delete CBUF[k];if(file){CUSTOM[k]=URL.createObjectURL(file);CNAME[k]=file.name||'custom sound';SBLOB[k]=file;await decodeSlot(k)}}
async function sndLoadAll(){try{const db=await idb();await new Promise(res=>{const c=db.transaction('snd').objectStore('snd').openCursor();
  c.onsuccess=()=>{const cur=c.result;if(!cur)return res();CUSTOM[cur.key]=URL.createObjectURL(cur.value);CNAME[cur.key]=cur.value.name||'custom sound';SBLOB[cur.key]=cur.value;cur.continue()};c.onerror=res})}catch(e){}
  await Promise.all(Object.keys(SBLOB).map(decodeSlot))}
async function decodeSlot(k){try{const ab=await SBLOB[k].arrayBuffer();CBUF[k]=await new Promise((res,rej)=>ac().decodeAudioData(ab,res,rej))}catch(e){delete CBUF[k]}}
function fadeOut(a,sec){if(a.stop)return a.stop(sec);const v0=a.volume,n=12;let i=0;const iv=setInterval(()=>{i++;a.volume=Math.max(0,v0*(1-i/n));if(i>=n){clearInterval(iv);a.pause()}},sec*1000/n)}
function stopMusic(sec=.6){const m=music;music=null;musicKey=null;if(m)fadeOut(m,sec)}
function playBuf(k,loop){const x=ac();if(!FILEOUT){FILEOUT=x.createGain();FILEOUT.gain.value=1;FILEOUT.connect(x.destination)}
  const src=x.createBufferSource(),g=x.createGain();src.buffer=CBUF[k];src.loop=!!loop;src.connect(g).connect(FILEOUT);src.start();
  const h={paused:false,stop(sec=.3){if(h.paused)return;h.paused=true;const t=x.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(1,t);g.gain.linearRampToValueAtTime(0,t+sec);try{src.stop(t+sec+.05)}catch(e){}}};
  src.onended=()=>{h.paused=true};return h}
function playFile(k,o={}){if(muted||IS_HOST||!CUSTOM[k])return null;let a;
  if(CBUF[k])a=playBuf(k,o.loop);else{a=new Audio(CUSTOM[k]);a.loop=!!o.loop;a.play().catch(()=>{})}
  if(o.music){stopMusic(.3);music=a;musicKey=k}if(o.max)setTimeout(()=>{if(!a.paused){fadeOut(a,1);if(music===a){music=null;musicKey=null}}},o.max*1000);return a}
/* every game moment goes through cue(): your file if you loaded one, otherwise the built-in sound */
function cue(n){if(muted||IS_HOST)return;
  switch(n){
    case 'title': CUSTOM.theme?playFile('theme',{music:1}):play('theme');break;
    case 'round': stopMusic(.4);CUSTOM.round?playFile('round'):CUSTOM.theme?playFile('theme',{music:1,max:5}):play('theme');break;
    case 'ding': CUSTOM.ding?playFile('ding'):play('ding');break;
    case 'buzzin': CUSTOM.buzzin?playFile('buzzin'):play('buzzin');break;
    case 'board': CUSTOM.board?playFile('board'):play('board',S&&S.set?roundsOf(S)[Math.min(S.r,roundsOf(S).length-1)].a.length:6);break;
    case 'timebeep': play('dup');break;
    case 'dup': CUSTOM.dup?playFile('dup'):play('dup');break;
    case 'strike': CUSTOM.strike?playFile('strike'):play('buzz');break;
    case 'award': if(CUSTOM.award)playFile('award');else{play('ding');setTimeout(()=>play('ding'),180);setTimeout(()=>play('applause',2.5),250)}break;
    case 'fmIntro': CUSTOM.theme?playFile('theme',{music:1,max:12}):play('theme');break;
    case 'winner': CUSTOM.theme?playFile('theme',{music:1,max:25}):play('theme');setTimeout(()=>play('applause',4),300);break;
    case 'clockStart': if(CUSTOM.fmclock)playFile('fmclock',{music:1,loop:1});break;
    case 'clockStop': if(musicKey==='fmclock')stopMusic(.2);break;
    case 'timeup': if(musicKey==='fmclock')stopMusic(.1);CUSTOM.timeup?playFile('timeup'):play('buzz');break;
    case 'bigwin': stopMusic(.2);if(CUSTOM.win)playFile('win',{music:1});else if(CUSTOM.theme){playFile('theme',{music:1,max:30});setTimeout(()=>play('applause',4.5),300)}else play('win');break;
    case 'themeToggle': if(music)stopMusic();else cue('title');break;
    case 'stop': stopMusic(.5);break;
  }}
function sfx(n){({dup:()=>cue('dup'),ding:()=>cue('ding'),buzz:()=>cue('strike'),award:()=>cue('award'),buzzin:()=>cue('buzzin'),timebeep:()=>cue('timebeep')}[n]||(()=>play(n)))()}

const ME=Math.random().toString(36).slice(2);const seen=new Set();let bc=null;
try{bc=new BroadcastChannel('friendsgiving-feud')}catch(e){}
let peer=null,conns=[],hconn=null,ROOM=null,linkState='',dialTimer=null,idTries=0;
function send(msg){msg._f=ME;msg._i=ME+Math.random();if(bc)try{bc.postMessage(msg)}catch(e){}
  try{localStorage.setItem('ffeud_msg',JSON.stringify(msg))}catch(e){}
  if(IS_HOST){if(hconn&&hconn.open)try{hconn.send(msg)}catch(e){}}
  else conns.forEach(c=>{if(c.open)try{c.send(msg)}catch(e){}})}
let FROM_REMOTE=false,SKEW=0;
function onMsg(m){if(!m||m._f===ME||seen.has(m._i))return;seen.add(m._i);
  if(IS_HOST){if(m.type==='state'){if(m.now)SKEW=m.now-Date.now();const old=S;S=m.S;
    const strip=x=>x&&x.fm?JSON.stringify({...x,fm:{...x.fm,time:0}}):JSON.stringify(x);
    if(old&&S&&strip(old)===strip(S)&&old.fm.time!==S.fm.time){const el=document.getElementById('hfmh');if(el){el.textContent=fmHead();return}}
    renderHost()}}
  else{if(m.type==='cmd'){FROM_REMOTE=true;try{dispatch(m.cmd,m.arg)}finally{FROM_REMOTE=false}}else if(m.type==='hello')broadcast()}}
if(bc)bc.onmessage=e=>onMsg(e.data);
addEventListener('storage',e=>{if(e.key==='ffeud_msg'&&e.newValue)try{onMsg(JSON.parse(e.newValue))}catch(x){}});
function broadcast(){if(!IS_HOST)send({type:'state',S,now:Date.now()})}

/* ---------- phone remote over the internet (PeerJS, free public broker) ---------- */
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){let c='';for(let i=0;i<4;i++)c+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return c}
const BASE=location.href.split('#')[0];
function startBoardPeer(){
  if(!window.Peer){linkState='nopeer';updateRoomUI();return}
  ROOM=localStorage.getItem('ffeud_room')||newCode();localStorage.setItem('ffeud_room',ROOM);
  peer=new Peer('ffeud-'+ROOM.toLowerCase());linkState='starting';updateRoomUI();
  peer.on('open',()=>{linkState='ready';idTries=0;updateRoomUI()});
  peer.on('connection',c=>{conns.push(c);c.on('data',onMsg);
    c.on('open',()=>{c.send({type:'state',S,_f:ME,_i:ME+Math.random()});updateRoomUI();toast('📱 Host remote connected')});
    c.on('close',()=>{conns=conns.filter(x=>x!==c);updateRoomUI()})});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();peer=null;if(++idTries>6)localStorage.removeItem('ffeud_room');setTimeout(startBoardPeer,4000);linkState='starting'}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){linkState='offline'}
    updateRoomUI()});
}
function roomHTML(){
  const n=conns.filter(c=>c.open).length;
  if(linkState==='nopeer'||linkState==='offline')return `📱 Phone remote needs internet — not reachable right now. Keyboard control still works.`;
  if(!ROOM||linkState==='starting')return `📱 Setting up your phone remote…`;
  return `📱 <b>Phone remote:</b> on your phone open <span class="url">${esc(BASE)}#host</span> and enter room code <b class="code">${ROOM}</b>
    ${n?`<span style="color:#7dff9a;font-weight:800">● ${n} remote connected</span>`:''}`;
}
function updateRoomUI(){const el=$('#roomInfo');if(el)el.innerHTML=roomHTML()}
function connectHost(code){
  code=(code||'').trim().toUpperCase();if(code.length<4)return;ROOM=code;localStorage.setItem('ffeud_hostroom',code);
  if(!window.Peer){linkState='nopeer';renderHost();return}
  if(!peer){peer=new Peer();
    peer.on('open',dial);
    peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
    peer.on('error',e=>{linkState=e.type==='peer-unavailable'?'notfound':'error';renderHost();redial(3000)});
  } else dial();
}
function redial(ms){clearTimeout(dialTimer);dialTimer=setTimeout(dial,ms)}
function dial(){
  if(!peer||!peer.open||!ROOM)return;if(hconn){try{hconn.close()}catch(e){}}
  linkState='connecting';renderHost();
  const c=peer.connect('ffeud-'+ROOM.toLowerCase(),{reliable:true});hconn=c;
  c.on('open',()=>{if(hconn!==c)return;linkState='connected';send({type:'hello'});renderHost()});
  c.on('data',onMsg);
  c.on('close',()=>{if(hconn!==c)return;linkState='lost';renderHost();redial(2000)});
}

/* =====================================================================
   GAME LOGIC — every action goes through dispatch()
   ===================================================================== */
const NO_UNDO=new Set(['undo','sound','tick','fmTimer','fmSel','akOut','akGo','akStop','akToggle','akSec']);
function dispatch(cmd,arg){
  if(IS_HOST){send({type:'cmd',cmd,arg});return}
  if(!S && cmd!=='start' && cmd!=='resume') return;
  if(S && !NO_UNDO.has(cmd)){hist.push(JSON.stringify(S));if(hist.length>300)hist.shift()}
  const fx={};
  switch(cmd){
    case 'start': S=freshGame(arg.names);hist.length=0;fx.theme=1;break;
    case 'resume': S=arg;S.fm.running=false;if(!S.set){S.set=drawSet();S.r=0;if(S.screen!=='title')loadRound(0);S.fm=freshFM()}
      if(!S.fo)S.fo={buzz:null,turn:null,first:null};if(S.ph===undefined)S.ph=S.awarded?'done':S.control!=null?(S.strikes>=3?'steal':'play'):'faceoff';
      if(S.akOn===undefined||S.akSec===5){S.akOn=false;S.akSec=30}if(S.gameWinner===undefined)S.gameWinner=null;S.ak=null;break;
    case 'setup': stopTicker();save();S=null;render({});broadcast();return;
    case 'title': S.screen='title';fx.theme=1;break;
    case 'round': loadRound(arg);fx.splash=1;break;
    case 'next':{if(S.screen!=='round'){hist.pop();return}const L=roundsOf(S).length,w=GW();
      if(S.awarded&&(w>=0||cur().sudden)){S.screen='winner';fx.win=w>=0;break}
      if(S.r<L-1){loadRound(S.r+1);fx.splash=1}else{S.screen='winner';fx.win=GW()>=0}break}
    case 'prev': if(S.screen!=='round'||S.r<=0){hist.pop();return}loadRound(S.r-1);fx.splash=1;break;
    case 'toggleQ': S.showQ=!S.showQ;break;
    case 'ans':{const R=cur(),i=arg,ph=S.ph||'play';if(S.screen!=='round'||i<0||i>=R.a.length||S.rev[i]){hist.pop();return}
      if(ph==='playpass'||(ph==='faceoff'&&S.fo.turn==null)){hist.pop();return}
      if(ph==='faceoff'){foAnswer(i,fx);break}
      S.rev[i]=S.awarded?2:1;if(!S.awarded)S.bank+=R.a[i].p*R.m;fx.flip=[i];fx.snd='ding';
      if(ph==='steal'){doAward(1-S.control,fx,'steal');fx.flash='STOLEN!';fx.later='award';break}
      if(ph==='play'){S.lastEv='hit';if(R.a.every((_,j)=>S.rev[j])){doAward(S.control,fx,'clear');fx.flash='BOARD CLEARED!';fx.later='award'}else akStart()}
      break}
    case 'buzz': if(S.screen!=='round'||S.ph!=='faceoff'){hist.pop();return}S.fo={buzz:arg,turn:arg,first:null};akStart();fx.pulse=arg;fx.snd='buzzin';break;
    case 'playpass': if(S.ph!=='playpass'||S.foWin==null){hist.pop();return}S.control=arg==='pass'?1-S.foWin:S.foWin;S.passed=arg==='pass';S.ph='play';S.lastEv='start';fx.pulse=S.control;akStart();break;
    case 'akGo': if(S.screen==='round')akRun(S.akSec||30);break;
    case 'akSec': S.akSec=+arg||30;if(S.ak)akRun(S.akSec);break;
    case 'akStop': akStop();break;
    case 'akToggle': S.akOn=S.akOn===false;if(!S.akOn)akStop();break;
    case 'akOut': if(!S.ak)return;S.ak=null;S.akOut=true;fx.flash='TIME!';fx.snd='timebeep';break;
    case 'reveal':{const R=cur();const i=arg;if(i<0||i>=R.a.length||S.rev[i])break;S.rev[i]=S.awarded?2:1;
      if(!S.awarded)S.bank+=R.a[i].p*R.m;fx.flip=[i];fx.snd='ding';break}
    case 'revealAll':{const R=cur();const list=[];R.a.forEach((_,i)=>{if(!S.rev[i]){S.rev[i]=2;list.push(i)}});fx.flip=list;fx.stagger=1;break}
    case 'strike':{const ph=S.ph||'play';
      if(ph==='faceoff'){if(S.fo.turn==null){fx.x=1;fx.snd='buzz';break}foAnswer(-1,fx);break}
      if(ph==='steal'){fx.x=1;fx.snd='buzz';doAward(S.control,fx,'stealFail');fx.later='award';break}
      if(ph==='done'||ph==='playpass'){fx.x=1;fx.snd='buzz';break}
      S.strikes=Math.min(3,S.strikes+1);fx.x=S.strikes;fx.snd='buzz';S.lastEv='miss';
      if(S.strikes>=3&&S.control!=null){S.ph='steal';akStart();fx.flash='STEAL!'}else akStart();break}
    case 'faceoffX': fx.x=1;fx.snd='buzz';break;
    case 'clearStrikes': S.strikes=0;if(S.ph==='steal'){S.ph='play';akStop()}break;
    case 'award': if(S.awarded||S.bank<=0)break;doAward(arg,fx);fx.snd='award';break;
    case 'score': S.teams[arg.t].score=Math.max(0,S.teams[arg.t].score+arg.d);fx.pulse=arg.t;break;
    case 'rename': S.teams[arg.t].name=String(arg.name).slice(0,24)||S.teams[arg.t].name;break;
    case 'setScore': S.teams[arg.t].score=Math.max(0,Math.round(+arg.v||0));fx.pulse=arg.t;break;
    case 'control': S.control=arg;if(arg!=null){fx.pulse=arg;if(!S.awarded&&S.screen==='round'){S.ph=S.strikes>=3?'steal':'play';if(S.foWin==null)S.foWin=arg}}break;
    case 'winner': S.screen='winner';fx.win=GW()>=0;break;
    case 'backToRound': S.screen='round';break;
    case 'fm': S.screen='fm';fx.splashFM=1;break;
    case 'fmTimer': if(S.fm.running){S.fm.running=false}else{if(S.fm.time<=0)S.fm.time=S.fm.player?25:20;S.fm.running=true}break;
    case 'fmResetTimer': S.fm.running=false;S.fm.time=S.fm.player?25:20;break;
    case 'fmPlayer': {const p=arg!=null?arg:(S.fm.player?0:1);S.fm.player=p;S.fm.running=false;S.fm.time=p?25:20;S.fm.hide=p===1;S.fm.stage='ask';S.fm.sel={p,r:firstOpen(p)};fx.snd='whoosh';break}
    case 'fmStage': S.fm.stage=arg;if(arg==='reveal')S.fm.running=false;break;
    case 'fmHide': S.fm.hide=!S.fm.hide;fx.snd='whoosh';break;
    case 'fmSel': S.fm.sel=arg;break;
    case 'fmText':{const {p,r,text}=arg;const c=S.fm.cells[p][r];const m=matchAnswer(text,fmQ(r));
      if(p===1&&text.trim()){const o=S.fm.cells[0][r];if((m>=0&&o.m===m)||(o.text&&norm(o.text)===norm(text))){hist.pop();fx.flash='DUPLICATE!';fx.snd='dup';fx.reEdit={p,r};break}}
      c.text=text.trim();c.m=c.text?m:-1;c.shown=false;S.fm.sel={p,r};break}
    case 'fmReveal':{const {p,r}=arg;const c=S.fm.cells[p][r];if(!c.text||c.shown)break;c.shown=true;const v=cellPts(p,r);
      fx.pop={p,r};fx.snd=v>0?'ding':'buzz';if(r<4&&S.fm.sel.p===p&&S.fm.sel.r===r)S.fm.sel={p,r:r+1};checkFMWin(fx);break}
    case 'fmAdj':{const {p,r,d}=arg;const c=S.fm.cells[p][r];if(!c.text)break;const n=fmQ(r).a.length;c.m=((c.m+1+d)%(n+1)+(n+1))%(n+1)-1;
      if(c.shown){fx.pop={p,r};fx.snd=c.m>=0?'ding':'buzz'}checkFMWin(fx);break}
    case 'fmSet':{const {p,r,m}=arg;const c=S.fm.cells[p][r];if(!c.text)break;c.m=m;if(c.shown){fx.pop={p,r};fx.snd=m>=0?'ding':'buzz'}checkFMWin(fx);break}
    case 'fmClear':{const {p,r}=arg;S.fm.cells[p][r]={text:'',m:-1,shown:false};checkFMWin(fx);break}
    case 'fmResetAll': S.fm=freshFM();break;
    case 'sound': if(arg==='theme')cue('themeToggle');else if(arg==='stopMusic')cue('stop');else sfx(arg);return;
    case 'undo': if(!hist.length){toast('Nothing to undo');return}{const was=S.fm.running,time=S.fm.time;S=JSON.parse(hist.pop());S.fm.running=false;S.ak=null;if(was)S.fm.time=time;toast('Undone');break}
    case 'newGame': S=freshGame([S.teams[0].name,S.teams[1].name]);fx.theme=1;break;
    case 'swapRound':{if(S.screen!=='round')break;const R=cur(),ex=new Set(setIds(S));
      if(R.sudden){const q=pickQ(POOL.sd,1,ex)[0];if(!q)break;S.set.sd=q.id;markUsed([q.id])}
      else{const q=pickQ(POOL.main.filter(x=>x.c===R.c),1,ex)[0]||pickQ(POOL.main,1,ex)[0];if(!q)break;S.set.rounds[S.r]=q.id;markUsed([q.id])}
      loadRound(S.r);fx.splash=1;break}
    case 'swapFM':{const r=arg,ex=new Set(setIds(S)),q=pickQ(POOL.fm,1,ex)[0];if(!q)break;S.set.fm[r]=q.id;markUsed([q.id]);
      S.fm.cells[0][r]={text:'',m:-1,shown:false};S.fm.cells[1][r]={text:'',m:-1,shown:false};checkFMWin(fx);break}
    default: return;
  }
  if(S&&!NO_UNDO.has(cmd)&&hist.length&&hist[hist.length-1]===JSON.stringify(S))hist.pop();
  if(S){if(S.screen!=='fm')S.fm.running=false;if(S.screen!=='round')S.ak=null}
  if(fx.noState){if(fx.snd)sfx(fx.snd);renderFx(fx);return}
  save();render(fx);broadcast();
  if(fx.reEdit&&!FROM_REMOTE)beginEdit(fx.reEdit.p,fx.reEdit.r);
}
function loadRound(i){S.screen='round';S.r=i;S.rev=[];S.strikes=0;S.bank=0;S.awarded=false;S.awardedTo=null;S.showQ=true;S.control=null;S.started=true;const aw=S.awards&&S.awards[i];if(aw){S.teams[aw.t].score=Math.max(0,S.teams[aw.t].score-aw.p);delete S.awards[i]}if(roundsOf(S)[i].sudden)S.gameWinner=null;S.ph='faceoff';S.fo={buzz:null,turn:null,first:null};S.foWin=null;S.lastEv=null;S.how=null;S.passed=false;S.ak=null;S.akOut=false}
function GW(){if(S.gameWinner!=null)return S.gameWinner;const [a,b]=S.teams;return Math.max(a.score,b.score)>=300&&a.score!==b.score?(a.score>b.score?0:1):-1}
function inGame(){return !!(S.started||S.r>0||S.rev.length||S.teams[0].score||S.teams[1].score)}
function nRounds(st=S){return st.set.rounds.length}
function leader300(){return S.teams.findIndex(t=>t.score>=300)}
/* auto clock (only if the host turned it on); otherwise any new answer just stops a running clock */
function akStart(){S.akOut=false;if(!S.akOn){S.ak=null;return}akRun(S.akSec||30)}
function akRun(d){S.akOut=false;S.ak={end:Date.now()+d*1000,dur:d}}
function akStop(){S.ak=null;S.akOut=false}
function doAward(t,fx,how){if(S.awarded)return;S.how=how||'manual';S.teams[t].score+=S.bank;S.awarded=true;S.awardedTo=t;S.ph='done';akStop();fx.pulse=t;
  if(cur().sudden)S.gameWinner=t;(S.awards=S.awards||{})[S.r]={t,p:S.bank}}
/* face-off: first buzzer answers; #1 wins outright, otherwise the other player tries to beat it; two misses = next pair */
function foAnswer(i,fx){const R=cur(),t=S.fo.turn,f=S.fo.first;
  if(i>=0){S.rev[i]=1;S.bank+=R.a[i].p*R.m;fx.flip=[i];fx.snd='ding'}else{fx.x=1;fx.snd='buzz'}
  let win=null,wi=-1;
  if(!f){if(i===0){win=t;wi=0}else{S.fo.first={t,i};S.fo.turn=1-t;akStart()}}
  else if(i>=0&&(f.i<0||i<f.i)){win=t;wi=i}
  else if(f.i>=0){win=f.t;wi=f.i}
  else{S.fo={buzz:null,turn:null,first:null,again:true};akStop();fx.flash='NEXT TWO PLAYERS!'}
  if(win!=null){S.foWin=win;akStop();fx.pulse=win;
    if(R.sudden){S.bank=R.a[wi].p*R.m;S.control=win;doAward(win,fx,'sudden');fx.later='award'}else S.ph='playpass'}}
function firstOpen(p){for(let r=0;r<5;r++)if(!S.fm.cells[p][r].shown)return r;return 4}
function checkFMWin(fx){const t=fmTotal();if(t>=200&&!S.fm.won){S.fm.won=true;fx.fmwin=1}else if(t<200)S.fm.won=false}
function save(){if(IS_HOST)return;try{if(S)localStorage.setItem('ffeud_state',JSON.stringify(S));else localStorage.removeItem('ffeud_state')}catch(e){}}

function akTick(){if(!S||!S.ak){if(akT){clearInterval(akT);akT=null}return}const left=Math.max(0,Math.ceil((S.ak.end-Date.now())/1000));

function guessSlot(n){n=n.toLowerCase();
  const M=[['dup',/dup|repeat|double.?answer|try.?again/],['timeup',/time.?s?.?up|out.?of.?time/],['win',/win|200|victory|celebrat/],['fmclock',/clock|fast.?money|countdown|timer|tick/],['buzzin',/buzz.?in|ring.?in|face.?off/],

addEventListener('keydown',e=>{
  if(IS_HOST)return;

  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='?'||k==='/'){toggleHelp();e.preventDefault();return}
  if(k==='f'){toggleFS();return}
  if(!S||S.screen==='setup')return;
  if(k==='Escape'&&e.shiftKey){dispatch('setup');return}
  if(k==='Escape'&&$('#help').classList.contains('show')){toggleHelp();return}
  if(k==='u'||(e.ctrlKey&&k==='z')){dispatch('undo');return}
  if(k==='m'){muted=!muted;if(muted)stopMusic(.2);if(FILEOUT)FILEOUT.gain.value=muted?0:1;if(MASTER)MASTER.gain.value=muted?0:.9;toast(muted?'Sound OFF':'Sound ON');return}
  if(k==='a'){play('applause');return}
  if(k==='s'){cue('themeToggle');return}
  let handled=true;
  if(S.screen==='title'){if(k===' '||k==='Enter')dispatch(inGame()?'backToRound':'round',inGame()?null:0);else if(k==='g')dispatch('fm');else handled=false}
  else if(S.screen==='round'){
    if(/^[1-8]$/.test(k))dispatch('ans',+k-1);
    else if(S.ph==='faceoff'&&S.fo.turn==null&&(k==='ArrowLeft'||k==='ArrowRight'))dispatch('buzz',k==='ArrowLeft'?0:1);
    else if(S.ph==='playpass'&&(k==='ArrowLeft'||k==='ArrowRight'))dispatch('control',k==='ArrowLeft'?0:1);
    else if(k==='l')dispatch(S.ak?'akStop':'akGo');
    else if(k==='x')dispatch('strike');else if(k==='z')dispatch('faceoffX');else if(k==='c')dispatch('clearStrikes');
    else if(k==='ArrowLeft'||k==='ArrowRight'){if(!S.ph||S.ph==='play'||S.ph==='steal')dispatch('award',k==='ArrowLeft'?0:1)}
    else if(k==='r')dispatch('revealAll');else if(k==='n')dispatch('next');else if(k==='b'){const aw=S.awards&&S.awards[S.r-1];if(S.r>0&&(!aw||confirm('Replay round '+S.r+'? The '+aw.p+' points '+S.teams[aw.t].name+' got in it will be taken back.')))dispatch('prev')}
    else if(k==='q')dispatch('toggleQ');else if(k==='w')dispatch('winner');else if(k==='g')dispatch('fm');else if(k==='t')dispatch('title');
    else handled=false}
  else if(S.screen==='winner'){const tie=GW()<0&&S.teams[0].score===S.teams[1].score;if(k===' '||k==='Enter'||k==='g')tie?dispatch('round',roundsOf(S).length-1):dispatch('fm');else if(k==='b'||k==='Escape')dispatch('backToRound');else handled=false}
  else if(S.screen==='fm'){
    const F=S.fm,{p,r}=F.sel,c=F.cells[p][r];
    if(k===' ')dispatch('fmTimer');
    else if(k==='Enter'){if(!c.text)beginEdit(p,r);else if(!c.shown)dispatch('fmReveal',{p,r});else if(r<4)dispatch('fmSel',{p,r:r+1})}
    else if(k==='e')beginEdit(p,r);
    else if(k==='ArrowUp')dispatch('fmSel',{p,r:Math.max(0,r-1)});else if(k==='ArrowDown')dispatch('fmSel',{p,r:Math.min(4,r+1)});
    else if(k==='ArrowLeft')dispatch('fmSel',{p:0,r});else if(k==='ArrowRight')dispatch('fmSel',{p:1,r});
    else if(k==='[')dispatch('fmAdj',{p,r,d:-1});else if(k===']')dispatch('fmAdj',{p,r,d:1});
    else if(k==='p'||k==='Tab')dispatch('fmPlayer');else if(k==='h')dispatch('fmHide');
    else if(k==='d')dispatch('sound','dup');else if(k==='x')dispatch('sound','buzz');else if(k==='k')dispatch('fmResetTimer');
    else if(k==='Delete'||k==='Backspace')dispatch('fmClear',{p,r});
    else if(k==='b'||k==='Escape')dispatch('winner');
    else handled=false}
  if(handled)e.preventDefault();
});

        do:f.i>=0?`Tap their answer. They win the face-off only with an answer <b>higher than #${f.i+1}</b>. Not on the board → ✕.`:`Tap their answer, or ✕ (then the next two players come up).`};}

  const drafts={};h.querySelectorAll('input[id^="in"]').forEach(i=>{if(i.value!==i.defaultValue)drafts[i.id]=i.value});
  if(!S&&linkState==='connected'){h.innerHTML=`<h1>🦃 Host Remote</h1>${linkHTML()}<div class="hcard"><h2>Waiting for the laptop</h2><div class="hdo">You’re connected. On the laptop, click <b>▶ START NEW GAME</b> (or <b>↻ Resume saved game</b>) and your controls show up here.</div></div>`;return}
  if(!S){h.innerHTML=`<h1>🦃 Host Remote</h1>${linkHTML()}<div class="hcard"><h2>Connect to the TV</h2>
     <div class="hdo">On the TV laptop, open the game. The setup screen shows a 4-letter <b>room code</b>. Enter it here:</div>
     <div class="hrow"><input id="roomIn" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(ROOM||localStorage.getItem('ffeud_hostroom')||'')}"><button class="hb gold" onclick="connectHost(document.getElementById('roomIn').value)">Connect</button></div>
     <div class="hdo" style="margin-top:8px">Then click <b>Start</b> on the laptop. This page becomes your control panel with every answer and a script of what to say.</div></div>`;
    restoreFocus(keep);return}
  const B=(label,cmd,arg,cls='')=>`<button class="hb ${cls}" onclick='dispatch(${JSON.stringify(cmd)},${JSON.stringify(arg===undefined?null:arg)})'>${label}</button>`;
  const sc=hostScript();
  const script=sc.h?`<div class="hcard hscript"><h2>${esc(sc.h)}</h2>${(Array.isArray(sc.say)?sc.say:[sc.say]).filter(Boolean).map(l=>l.startsWith('(')?`<div class="hcue">${esc(l)}</div>`:`<div class="hsay">🎤 ${q_(l)}</div>`).join('')}<div class="hdo">${sc.do}</div></div>`:'';
  const scores=`<div class="hcard"><h2>Scores & team names</h2><div class="hscore">${S.teams.map((t,i)=>`<div>
    <input id="nm${i}" value="${esc(t.name)}" onchange="dispatch('rename',{t:${i},name:this.value})" style="width:100%;font-weight:800;font-size:16px;padding:6px;border-radius:8px;border:2px solid #8fb8ff;text-align:center">
    <div class="v">${t.score}</div>
    <div class="hrow"><input id="sc${i}" type="number" inputmode="numeric" value="${t.score}" onkeydown="if(event.key==='Enter')dispatch('setScore',{t:${i},v:this.value})"><button class="hb" onclick="dispatch('setScore',{t:${i},v:document.getElementById('sc${i}').value})">Set</button></div>
    <div class="adj">${[-10,-5,-1,1,5,10].map(d=>`<button class="hb" onclick='dispatch("score",{t:${i},d:${d}})'>${d>0?'+':''}${d}</button>`).join('')}</div></div>`).join('')}</div></div>`;
  let body='';
  if(S.screen==='round'){
    const R=cur(),ph=S.ph||'play',fo=S.fo||{},T=S.teams.map(t=>esc(t.name));
    const steps=R.sudden?['Face-off','Winner']:['Face-off','Play/Pass','Play','Steal','Points'];
    const si=R.sudden?(ph==='done'?1:0):({faceoff:0,playpass:1,play:2,steal:3,done:4}[ph]);
    const stepsHTML=`<div class="hsteps">${steps.map((x,k)=>`<span class="${k===si?'on':k<si?'past':''}">${x}</span>`).join('')}</div>`;
    let act='',tap=false,note='';
    if(ph==='faceoff'&&fo.turn==null){act=`<div class="hgrid">${B('🔔 '+T[0],'buzz',0,'gold hbig')}${B('🔔 '+T[1],'buzz',1,'gold hbig')}</div>`;note='Who hit the buzzer first? Tap their team, then tap what they say.'}
    else if(ph==='faceoff'){tap=true;act=`<div class="hgrid">${B('✕ Not on the board','strike',null,'red hbig')}</div>`;const f=fo.first;
      note=!f?`Answering: ${T[fo.turn]}. Tap what they said.`:f.i>=0?`${T[f.t]} got #${f.i+1}. To win the face-off, ${T[fo.turn]} need ${f.i===1?'the #1 answer':'#1'+(f.i>1?'–#'+f.i:'')}.`:`${T[f.t]} missed. Any answer on the board wins it for ${T[fo.turn]}.`}
    else if(ph==='playpass'){act=`<div class="hgrid">${B('▶ PLAY','playpass','play','gold hbig')}${B('PASS ⇄','playpass','pass','hbig')}</div>`;note=`${T[S.foWin]} won the face-off — play or pass?`}
    else if(ph==='play'){tap=true;act=`<div class="hgrid">${B('✕ STRIKE','strike',null,'red hbig')}</div>`;note=`${T[S.control]} playing &nbsp; ${'❌'.repeat(S.strikes)}${'⬜'.repeat(3-S.strikes)}`}
    else if(ph==='steal'){tap=true;act=`<div class="hgrid">${B('✕ Wrong — '+T[S.control]+' keep it','strike',null,'red hbig')}</div>`;note=`${T[1-S.control]} can steal ${S.bank}. On the board? Tap it.`}
    else{tap=true;const more=R.a.some((_,i)=>!S.rev[i]);act=`<div class="hgrid">${more?B('Reveal the rest','revealAll',null,'hbig'):''}${B(esc(nextLabel()),'next',null,'gold hbig')}</div>`;
      note=S.awardedTo!=null?`${T[S.awardedTo]} got the points. Tapping answers now just shows them.`:''}
    const clock=(S.akOut?`<div class="htime out">⏰ TIME’S UP! If they didn’t answer, tap ✕</div>`:'')+(ph==='done'?'':S.ak?`<div class="hgrid">${B('⏹ Stop clock — <span id="hak"></span>','akStop',null,'hbig')}</div>`:`<div class="hgrid">${B('⏱ Start '+(S.akSec||30)+'-sec clock','akGo',null,'hbig blue')}</div>`);
    const list=R.a.map((a,i)=>`<div class="hans ${S.rev[i]?'done':''} ${tap?'':'dim'}" ${tap&&!S.rev[i]?`onclick='dispatch("ans",${i})'`:''}><span class="n">${i+1}</span>${esc(a.t)}<span class="p">${a.p}${R.m>1?' ×'+R.m:''}</span></div>`).join('');
    body=`<div class="hcard hnow"><h2>${R.sudden?'⚡ Sudden death':'Round '+(S.r+1)+' of '+nRounds()} • ${MULT[R.m]} POINTS • Bank ${S.bank}</h2>${stepsHTML}
     <div class="hq">${esc(R.q)}</div>${note?`<div class="hnote">${note}</div>`:''}${act}${clock}<div style="margin-top:10px">${list}</div>
     <div class="hgrid" style="margin-top:10px">${B('↶ UNDO','undo',null,'gold')}${B(S.akOn?'Auto-start clock: ON':'Auto-start clock: OFF','akToggle',null,S.akOn?'sel':'')}</div>
     <div class="hsecs"><span>Clock length:</span>${[10,20,30,45,60].map(n=>B(n+'s','akSec',n,(S.akSec||30)===n?'sel':'')).join('')}</div></div>
     <details class="hcard hmore" ${moreOpen?'open':''} ontoggle="moreOpen=this.open"><summary>🛠 Manual fixes (only if something goes wrong)</summary><div class="hgrid" style="margin-top:8px">
     ${B('Playing: '+T[0],'control',0,S.control===0?'sel':'')}${B('Playing: '+T[1],'control',1,S.control===1?'sel':'')}${B('✕ Strike','strike',null,'red')}${B('✕ Buzzer sound only','faceoffX',null,'red')}${B('Clear strikes','clearStrikes')}
     ${B('◀ Bank to '+T[0],'award',0,'gold')}${B('Bank to '+T[1]+' ▶','award',1,'gold')}${B('Reveal rest','revealAll')}${B('Next round ▶','next')}${B(S.showQ?'Hide question':'Show question','toggleQ')}<button class="hb" onclick="if(!${S.rev.some(Boolean)}||confirm('Swap in a different question? This round restarts.'))dispatch('swapRound')">🔀 Swap question</button></div></details>`;
  } else if(S.screen==='fm'){
    const F=S.fm,p=F.player,st=F.stage||'ask',nx=fmNext(),full=p?25:20;
    const si=p*2+(st==='reveal'?1:0)+(p===1&&st==='reveal'&&!nx?1:0);
    const steps=`<div class="hsteps">${['P1 answers','P1 reveal','P2 answers','P2 reveal','Result'].map((x,k)=>`<span class="${k===si?'on':k<si?'past':''}">${x}</span>`).join('')}</div>`;
    let act='';
    if(F.won&&!nx)act=`<div class="hnote">🎉 ${fmTotal()} points — they won!</div>`;
    else if(st==='ask')act=`<div class="hgrid">${B(F.running?'⏸ Pause clock':F.time<full?'▶ Resume clock':`▶ START CLOCK (${full}s)`,'fmTimer',null,'gold hbig')}${B('⏭ Done — reveal','fmStage','reveal','hbig')}</div>`+(p===1?`<div class="hgrid" style="margin-top:8px">${B('🔁 Duplicate sound','sound','dup','red')}</div>`:'');
    else if(nx)act=nx.needText?`<div class="hgrid"><button class="hb gold hbig" onclick="fmShow(${p},${nx.r})">🗣 Show answer ${nx.r+1}: “${esc(fmDraft(p,nx.r)||'pass')}”</button></div>`:`<div class="hgrid">${B('📊 SURVEY SAYS!','fmReveal',{p,r:nx.r},'gold hbig')}</div>`;
    else if(p===0)act=`<div class="hgrid">${B('Player 2 ▶','fmPlayer',1,'gold hbig')}</div>`;
    else act=`<div class="hgrid">${F.hide?B('Show player 1’s answers','fmHide',null,'hbig'):''}</div>`;
    const rows=[0,1,2,3,4].map(r=>{const q=fmQ(r),c=F.cells[p][r],v=cellPts(p,r),k=fmKey(p,r),o=F.cells[0][r];
      return `<div class="hfmrow ${nx&&nx.r===r&&st==='reveal'?'cur':''}"><div class="q">${r+1}. ${esc(q.q)}</div>
       ${p===1?`<div class="m" style="margin:2px 0 4px">Player 1 said: <b>${esc(fmDraft(0,r)||'—')}</b>${o.shown?` (${cellPts(0,r)})`:''}</div>`:''}
       <div class="line"><input id="in${p}${r}" data-k="${k}" value="${esc(fmDraft(p,r))}" placeholder="${st==='ask'?'type answer + return':'(pass)'}" autocomplete="off" autocorrect="off" enterkeyhint="next" ${c.text?'disabled':''}
         oninput="FMD[this.dataset.k]=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();fmEnter(${p},${r},this)}">
         <span class="fmv">${c.shown?v:''}</span></div>
       ${c.text?`<div class="line"><span class="m">counts as:</span><select onchange='dispatch("fmSet",{p:${p},r:${r},m:+this.value})'><option value="-1" ${c.m<0?'selected':''}>✕ not on board (0)</option>${q.a.map((a,i)=>`<option value="${i}" ${c.m===i?'selected':''}>${esc(a.t)} (${a.p})</option>`).join('')}</select>
         <button class="hb" onclick="dispatch('fmClear',{p:${p},r:${r}})">✎ redo</button></div>`:''}
       <div class="opts">${q.a.map(a=>`${esc(a.t)} <b>${a.p}</b>`).join(' · ')}</div></div>`}).join('');
    body=`<div class="hcard hnow"><h2 id="hfmh">${fmHead()}</h2>${steps}<div id="hdup" class="hnote" style="display:none;background:#a8180b;color:#fff"></div>${act}</div>
     <div class="hcard hfm">${rows}</div>
     <details class="hcard hmore" ${moreOpen?'open':''} ontoggle="moreOpen=this.open"><summary>🛠 Fast Money fixes</summary><div class="hgrid" style="margin-top:8px">
      ${B('Player 1','fmPlayer',0,p===0?'sel':'')}${B('Player 2','fmPlayer',1,p===1?'sel':'')}${B('Reset clock','fmResetTimer')}${B(st==='ask'?'Go to reveal':'Back to typing','fmStage',st==='ask'?'reveal':'ask')}
      ${B(F.hide?'Show P1 answers':'Hide P1 answers','fmHide')}${B('🔁 Duplicate sound','sound','dup','red')}${B('✕ Buzzer','sound','buzz','red')}
      ${[0,1,2,3,4].map(r=>`<button class="hb" onclick="if(confirm('Swap Fast Money question ${r+1} for a different one?'))dispatch('swapFM',${r})">🔀 Swap Q${r+1}</button>`).join('')}
      <button class="hb" onclick="if(confirm('Erase ALL Fast Money answers?')){FMD={};dispatch('fmResetAll')}">Clear all</button></div></details>`;
  } else if(S.screen==='winner'){
    body=`<div class="hcard"><h2>Winner screen</h2><div class="hgrid">${GW()<0&&S.teams[0].score===S.teams[1].score?B('⚡ Sudden death','round',roundsOf(S).length-1,'gold hbig'):B('💰 Go to Fast Money','fm',null,'gold hbig')}${B('Back to board','backToRound')}${B('Sudden death','round',roundsOf(S).length-1)}</div></div>`;
  } else body=`<div class="hcard"><h2>Title screen</h2><div class="hgrid">${inGame()?B('▶ Back to the game','backToRound',null,'gold hbig'):B('▶ Start Round 1','round',0,'gold hbig')}</div></div>`;
  const CB=(label,cmd,arg,msg)=>`<button class="hb" onclick='if(${msg?'confirm('+JSON.stringify(msg).replace(/'/g,"&#39;")+')':'true'})dispatch(${JSON.stringify(cmd)},${JSON.stringify(arg)})'>${label}</button>`;
  const rep=i=>{const aw=S.awards&&S.awards[i];return aw?`Replay this round? The ${aw.p} points ${S.teams[aw.t].name} got in it will be taken back.`:(S.screen!=='round'||S.r!==i)&&S.rev.length&&!S.awarded&&S.screen==='round'?'Leave this round? Its board and bank will be cleared.':null};
  const nav=`<div class="hcard"><h2>Game</h2><div class="hgrid">${B('Title','title')}${S.screen==='round'?CB('◀ Prev round','prev',null,S.r>0?rep(S.r-1):null)+B('Next round ▶','next'):''}${B('🏆 Winner','winner')}${B('💰 Fast Money','fm')}${B('↶ UNDO','undo',null,'gold')}
     ${B('🎵 Theme on/off','sound','theme')}${B('⏹ Stop music','sound','stopMusic')}${B('👏 Applause','sound','applause')}${B('🔔 Ding','sound','ding')}<button class="hb red" onclick="if(confirm('Start a brand-new game with new questions? Scores reset to 0.'))dispatch('newGame')">🔀 New game (new questions)</button></div></div>`;
  const jump=`<div class="hcard"><h2>Jump to round</h2><div class="hgrid">${roundsOf(S).map((R,i)=>CB((S.screen==='round'&&S.r===i?'● ':'')+(R.sudden?'Sudden death':'R'+(i+1))+' ×'+R.m,'round',i,rep(i))).join('')}</div></div>`;
  setTimeout(()=>{for(const id in drafts){const i=document.getElementById(id);if(i&&i!==document.activeElement)i.value=drafts[id]}});
  h.innerHTML=`<h1>🦃 Host Remote</h1>${linkHTML()}${script}${body}${scores}${nav}${jump}<div class="hcard"><button class="hb" onclick="printCards()">🖨 Print host cards</button></div>`;
  restoreFocus(keep);
}
setInterval(()=>{if(!IS_HOST||!S||!S.ak)return;const el=document.getElementById('hak');if(el)el.textContent=Math.max(0,Math.ceil((S.ak.end-Date.now()-SKEW)/1000))+'s left'},250);
function restoreFocus(keep){if(!keep)return;const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}

/* ---------- Printable host cards ---------- */
function printCards(){
  if(!S){alert('Start a game first — host cards print the questions for the current game.');return}
  let h=`<h1>Friendsgiving Feud — HOST CARDS (this game)</h1>`;
  roundsOf(S).forEach((R,i)=>{
    h+=`<h2>${R.sudden?'SUDDEN DEATH':'ROUND '+(i+1)} — ${MULT[R.m]} POINTS (×${R.m})</h2><div class="pq">${esc(R.q)}</div><table>${R.a.map((a,j)=>`<tr><td style="width:24px">${j+1}</td><td>${esc(a.t)}</td><td class="p">${a.p}</td><td class="p">${a.p*R.m}</td></tr>`).join('')}</table>`});
  h+=`<h2 class="pb">FAST MONEY (Player 1: 20 sec, Player 2: 25 sec, goal 200)</h2>`;
  [0,1,2,3,4].forEach(r=>{const q=fmQ(r);h+=`<div class="pq">${r+1}. ${esc(q.q)}</div><table>${q.a.map(a=>`<tr><td>${esc(a.t)} <span class="al">${a.al.length?'(also: '+a.al.map(esc).join(', ')+')':''}</span></td><td class="p">${a.p}</td></tr>`).join('')}</table>`});
  $('#print').innerHTML=h;window.print();
}

/* ---------- boot ---------- */
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`scale(${s})`}
if(IS_HOST){document.body.className='host-mode';document.documentElement.style.background='#06123a';$('#wrap').style.display='none';$('#host').style.display='block';renderHost();send({type:'hello'});
  const hc=(location.hash.split('=')[1]||'').toUpperCase();if(hc)connectHost(hc)}
else{document.body.className='board-mode';addEventListener('resize',fit);fit();render({});startBoardPeer();sndLoadAll().then(()=>{if(!S)render({})});
  const unlock=()=>{const a=ac();if(a.state!=='running')a.resume()};document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);
  const sw=document.createElement('div');sw.id='sndWarn';sw.textContent='🔊 Click here to turn on the game sound';sw.onclick=unlock;document.body.appendChild(sw);
  setInterval(()=>{sw.style.display=(!muted&&(!AC||AC.state!=='running'))?'block':'none'},700)}
</script>
</body>
</html>
